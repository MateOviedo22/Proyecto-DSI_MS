services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: motoman-backend
    env_file:
      - ./backend/.env
    environment:
      PORT: 5000
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: http://localhost:5000/api
    container_name: motoman-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped